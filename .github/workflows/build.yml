name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Stable debug signing across runs so each debug APK can update the previous
      # install instead of erroring "App not installed". The keystore is generated
      # once, cached, and reused; build.gradle.kts points the debug signingConfig
      # at it when present (no-op for builds without the file).
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: dogfood-debug.keystore
          key: debug-keystore-v1

      - name: Ensure debug keystore
        run: |
          if [ ! -f dogfood-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore dogfood-debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build optimized APK
        run: ./gradlew :app:assembleGithubRelease

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/githubRelease/*.apk
